name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      YOUTUBE_DL_SKIP_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install verified Windows yt-dlp
        shell: pwsh
        run: |
          $base = 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19'
          $target = 'node_modules/yt-dlp-exec/bin/yt-dlp.exe'
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile $target
          $checksumsPath = Join-Path $env:RUNNER_TEMP 'yt-dlp-SHA2-256SUMS.txt'
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile $checksumsPath
          $checksums = Get-Content $checksumsPath -Raw
          $line = ($checksums -split "`n" | Where-Object { $_ -match '\s+yt-dlp\.exe\s*$' })
          if (!$line) { throw 'Missing official yt-dlp checksum' }
          $expected = ($line.Trim() -split '\s+')[0]
          $actual = (Get-FileHash $target -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'yt-dlp checksum mismatch' }
          & $target --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp could not run' }
          & .\node_modules\ffmpeg-static\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg could not run' }
      - name: Test download engine and browser bridge
        shell: pwsh
        run: |
          foreach ($test in @('test:browser-integration', 'test:parallel-fallback', 'test:integrity', 'test:pause-resume-integrity')) {
            npm run $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Build Windows x64 installer
        run: npm run build -- --publish never
      - name: Package extension and create checksums
        shell: pwsh
        run: |
          $installer = Get-Item 'dist/TurboDM Setup *.exe'
          if (!$installer -or $installer.Length -lt 10MB) { throw 'Installer missing or incomplete' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and package version differ' }
          $publishedName = "TurboDM.Setup.$version.exe"
          Move-Item "$($installer.FullName).blockmap" "dist/$publishedName.blockmap"
          Move-Item $installer.FullName "dist/$publishedName"
          $installer = Get-Item "dist/$publishedName"
          $extension = "dist/TurboDM-Browser-Extension-$version.zip"
          Compress-Archive -Path browser-extension,build/EXTENSION_SETUP.md -DestinationPath $extension
          $files = @($installer.FullName, "$($installer.FullName).blockmap", $extension)
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $checksums | Set-Content 'dist/SHA256SUMS.txt' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: TurboDM-Windows-x64
          path: |
            dist/TurboDM*.exe
            dist/TurboDM*.exe.blockmap
            dist/SHA256SUMS.txt
            dist/TurboDM-Browser-Extension-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TurboDM-Windows-x64
          path: dist
      - name: Publish installer and extension
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(dist/*.exe dist/*.exe.blockmap dist/TurboDM-Browser-Extension-*.zip dist/SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "TurboDM $RELEASE_TAG" --notes-file ".github/release-notes-$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY"

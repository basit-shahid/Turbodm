<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>TurboDM</title></head><body>
<header><img src="icon-48.png" width="36" height="36" alt=""><div><strong>TurboDM</strong><small>Your download workspace</small></div><button id="theme" aria-label="Switch theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg></button></header>
<main><p id="status" role="status">Connecting to desktop…</p><label class="capture"><span>Capture browser downloads</span><input id="enabled" type="checkbox" checked></label><form id="send"><label for="url">Download a link</label><input id="url" type="url" placeholder="https://example.com/file" required><button class="primary" type="submit">Add to TurboDM</button></form><p id="feedback" role="status"></p><p class="hint">Your browser asks to open TurboDM. Downloads start only when you choose Start download in the app.</p></main><script src="popup.js"></script></body></html>
